<svg width="100%" viewBox="0 0 680 712" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>{{HEADLINE}}: prospect-facing comparison graphic</title>
  <desc>A side-by-side comparison showing 3 outcome metrics, 4 capability comparisons, and a customer quote.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="11" font-weight="500" letter-spacing="1.5" class="ts">At a glance</text>
  <text x="40" y="80" font-size="24" font-weight="500" class="th">{{HEADLINE}}</text>
  <text x="40" y="104" class="ts">{{SUBHEAD}}</text>
  <rect x="40" y="116" width="44" height="3" rx="1" fill="{{ACCENT_COLOR}}"/>

  <rect x="40" y="146" width="194" height="98" rx="8" fill="{{COMPANY_COLOR_BG}}"/>
  <text x="137" y="190" font-size="34" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_1_VALUE}}</text>
  <text x="137" y="214" font-size="13" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_1_LABEL}}</text>
  <text x="137" y="232" font-size="11" fill="{{COMPANY_COLOR_SUB}}" text-anchor="middle">{{METRIC_1_SOURCE}}</text>

  <rect x="243" y="146" width="194" height="98" rx="8" fill="{{COMPANY_COLOR_BG}}"/>
  <text x="340" y="190" font-size="34" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_2_VALUE}}</text>
  <text x="340" y="214" font-size="13" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_2_LABEL}}</text>
  <text x="340" y="232" font-size="11" fill="{{COMPANY_COLOR_SUB}}" text-anchor="middle">{{METRIC_2_SOURCE}}</text>

  <rect x="446" y="146" width="194" height="98" rx="8" fill="{{COMPANY_COLOR_BG}}"/>
  <text x="543" y="190" font-size="34" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_3_VALUE}}</text>
  <text x="543" y="214" font-size="13" font-weight="500" fill="{{COMPANY_COLOR}}" text-anchor="middle">{{METRIC_3_LABEL}}</text>
  <text x="543" y="232" font-size="11" fill="{{COMPANY_COLOR_SUB}}" text-anchor="middle">{{METRIC_3_SOURCE}}</text>

  <text x="40" y="290" font-size="11" font-weight="500" letter-spacing="1.5" class="ts">Capability comparison</text>
  <line x1="40" y1="298" x2="640" y2="298" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="40" y="328" font-size="12" font-weight="500" class="ts">Capability</text>

  <circle cx="312" cy="322" r="11" fill="{{COMPANY_COLOR}}"/>
  <circle cx="312" cy="322" r="6" fill="{{ACCENT_COLOR}}"/>
  <circle cx="312" cy="322" r="2.2" fill="#FFFFFF"/>
  <text x="328" y="328" font-size="18" font-weight="500" fill="{{COMPANY_COLOR}}" letter-spacing="-0.3">{{COMPANY_WORDMARK}}</text>

  <text x="527" y="329" font-size="22" font-weight="500" fill="{{COMPETITOR_WORDMARK_COLOR}}" text-anchor="middle" letter-spacing="-0.5">{{COMPETITOR_WORDMARK}}</text>

  <line x1="40" y1="350" x2="640" y2="350" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="40" y="386" font-size="14" font-weight="500" class="th">{{CAP_1_TITLE}}</text>
  <text x="40" y="404" font-size="12" class="ts">{{CAP_1_SUB}}</text>
  <rect x="275" y="388" width="145" height="10" rx="2" fill="{{COMPANY_COLOR_SOFT}}"/>
  <rect x="275" y="388" width="{{CAP_1_COMPANY_BAR}}" height="10" rx="2" fill="{{COMPANY_COLOR}}"/>
  <rect x="455" y="388" width="145" height="10" rx="2" fill="{{COMPETITOR_COLOR_SOFT}}"/>
  <rect x="455" y="388" width="{{CAP_1_COMPETITOR_BAR}}" height="10" rx="2" fill="{{COMPETITOR_COLOR}}"/>

  <line x1="40" y1="424" x2="640" y2="424" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2,3"/>

  <text x="40" y="450" font-size="14" font-weight="500" class="th">{{CAP_2_TITLE}}</text>
  <text x="40" y="468" font-size="12" class="ts">{{CAP_2_SUB}}</text>
  <rect x="275" y="452" width="145" height="10" rx="2" fill="{{COMPANY_COLOR_SOFT}}"/>
  <rect x="275" y="452" width="{{CAP_2_COMPANY_BAR}}" height="10" rx="2" fill="{{COMPANY_COLOR}}"/>
  <rect x="455" y="452" width="145" height="10" rx="2" fill="{{COMPETITOR_COLOR_SOFT}}"/>
  <rect x="455" y="452" width="{{CAP_2_COMPETITOR_BAR}}" height="10" rx="2" fill="{{COMPETITOR_COLOR}}"/>

  <line x1="40" y1="488" x2="640" y2="488" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2,3"/>

  <text x="40" y="514" font-size="14" font-weight="500" class="th">{{CAP_3_TITLE}}</text>
  <text x="40" y="532" font-size="12" class="ts">{{CAP_3_SUB}}</text>
  <rect x="275" y="516" width="145" height="10" rx="2" fill="{{COMPANY_COLOR_SOFT}}"/>
  <rect x="275" y="516" width="{{CAP_3_COMPANY_BAR}}" height="10" rx="2" fill="{{COMPANY_COLOR}}"/>
  <rect x="455" y="516" width="145" height="10" rx="2" fill="{{COMPETITOR_COLOR_SOFT}}"/>
  <rect x="455" y="516" width="{{CAP_3_COMPETITOR_BAR}}" height="10" rx="2" fill="{{COMPETITOR_COLOR}}"/>

  <line x1="40" y1="552" x2="640" y2="552" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="2,3"/>

  <text x="40" y="578" font-size="14" font-weight="500" class="th">{{CAP_4_TITLE}}</text>
  <text x="40" y="596" font-size="12" class="ts">{{CAP_4_SUB}}</text>
  <rect x="275" y="580" width="145" height="10" rx="2" fill="{{COMPANY_COLOR_SOFT}}"/>
  <rect x="275" y="580" width="{{CAP_4_COMPANY_BAR}}" height="10" rx="2" fill="{{COMPANY_COLOR}}"/>
  <rect x="455" y="580" width="145" height="10" rx="2" fill="{{COMPETITOR_COLOR_SOFT}}"/>
  <rect x="455" y="580" width="{{CAP_4_COMPETITOR_BAR}}" height="10" rx="2" fill="{{COMPETITOR_COLOR}}"/>

  <line x1="40" y1="616" x2="640" y2="616" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="40" y="648" font-size="15" font-style="italic" font-family="var(--font-serif)" class="t">{{QUOTE}}</text>
  <text x="40" y="672" font-size="12" class="ts">{{ATTRIBUTION}}</text>

</svg>
